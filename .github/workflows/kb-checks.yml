name: KB checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2

      - name: Frontmatter, naming and placement
        run: python tools/check_frontmatter.py
      - name: Internal links
        run: python tools/check_links.py
      - name: Generated files match their originals
        run: for s in tools/intake/*.py; do python "$s" --check; done
      - name: Owners are GitHub users
        run: python tools/check_owners.py
      - name: SAGA addresses are documented
        run: python tools/check_saga_addresses.py
      - name: Skills
        run: python tools/check_skills.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
            !seed/**
            !templates/**

  compile-examples:
    # ApolloCrossDev supports Ubuntu 24.04 only.
    runs-on: ubuntu-24.04
    # Enabled by the repository variable KB_COMPILE_ENABLED = "true".
    if: vars.KB_COMPILE_ENABLED == 'true'
    env:
      ACD_DIR: /home/runner/ApolloCrossDev
      PREFIX: /home/runner/ApolloCrossDev/Compilers/GCC-6.50-Dev
      APOLLOLIB: /home/runner/acd-src/Projects/ApolloLib
    steps:
      - uses: actions/checkout@v7

      # The toolchain is built from source and cached. The cache key covers only
      # what the build uses: the build script and Compilers/_archives (patches,
      # sources). Commits to Projects/ (ApolloLib, examples) or the README don't
      # trigger a rebuild, which takes about an hour.
      - name: Find ApolloCrossDev commit
        id: acd
        run: echo "sha=$(git ls-remote https://github.com/WDrijver/ApolloCrossDev refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      # Fetch the commit without file contents (blob:none) plus Projects/ApolloLib:
      # the trees give the cache key, and snippets may include ApolloLib's headers.
      - name: Fetch ApolloLib and the build key
        id: key
        run: |
          git init -q /home/runner/acd-src
          cd /home/runner/acd-src
          git sparse-checkout set --no-cone Projects/ApolloLib
          git fetch -q --depth 1 --filter=blob:none https://github.com/WDrijver/ApolloCrossDev ${{ steps.acd.outputs.sha }}
          git checkout -q FETCH_HEAD
          test -f "$APOLLOLIB/ApolloCrossDev_Lib.h"
          script=$(git rev-parse --short=12 FETCH_HEAD:GCC-6.50-Dev-Linux.sh)
          archives=$(git rev-parse --short=12 FETCH_HEAD:Compilers/_archives)
          echo "build=$script-$archives" >> "$GITHUB_OUTPUT"
      - name: Restore ApolloCrossDev
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.PREFIX }}
          key: apollocrossdev-gcc650dev-${{ steps.key.outputs.build }}

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build ApolloCrossDev
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 180
        env:
          TERM: xterm
        run: |
          git init -q "$ACD_DIR"
          cd "$ACD_DIR"
          git fetch -q --depth 1 https://github.com/WDrijver/ApolloCrossDev ${{ steps.acd.outputs.sha }}
          git checkout -q FETCH_HEAD
          bash GCC-6.50-Dev-Linux.sh
      - name: Check toolchain binaries
        run: |
          for b in m68k-amigaos-gcc m68k-amigaos-g++ vasmm68k_mot; do
            test -x "$PREFIX/bin/$b" || { echo "::error::$b missing after build"; exit 1; }
          done
          "$PREFIX/bin/m68k-amigaos-gcc" --version | head -1
      - name: Upload build logs
        if: failure() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apollocrossdev-logs
          path: ${{ env.PREFIX }}/_logs
      - name: Save ApolloCrossDev
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.PREFIX }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Toolchain smoke test
        run: |
          mkdir -p build/smoke
          cp tools/smoke/* build/smoke/
          sh tools/compile-snippets.sh build/smoke
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python tools/extract_compile_blocks.py
      - name: Compile kb:compile blocks
        run: sh tools/compile-snippets.sh
      - name: Check emitted code (kb:expect)
        run: python tools/check_emitted_code.py
      - name: Assemble all other asm blocks
        run: sh tools/compile-snippets.sh build/fragments
      - name: Build the V4 hardware tests
        run: python tools/v4/v4test.py build
